services:
  db:
    image: postgres:16-alpine
    container_name: trackforge-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-trackforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-trackforge}"]
      interval: 3s
      timeout: 3s
      retries: 5
      
volumes:
  postgres_data:
    name: trackforge_postgres_data
