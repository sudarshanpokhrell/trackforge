basePath: /api/v1
definitions:
  main.AddIssueAssigneePayload:
    properties:
      user_id:
        type: string
    type: object
  main.AddIssueLabelPayload:
    properties:
      label_id:
        type: integer
    type: object
  main.AddProjectMemberPayload:
    properties:
      role:
        description: Role defaults to contributor.
        type: string
      user_id:
        type: string
    type: object
  main.ChangePasswordPayload:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  main.CompleteCyclePayload:
    properties:
      move_open_issues_to:
        description: |-
          MoveOpenIssuesTo is another uncompleted cycle in the project, or null (or
          left out) to leave open issues with no cycle.
        type: integer
    type: object
  main.CreateCyclePayload:
    properties:
      description:
        type: string
      end_date:
        type: string
      name:
        type: string
      start_date:
        type: string
    type: object
  main.CreateIssueCommentPayload:
    properties:
      content:
        type: string
    type: object
  main.CreateIssuePayload:
    properties:
      description:
        type: string
      label_ids:
        description: LabelIDs are applied in the same transaction; each must belong
          to the project.
        items:
          type: integer
        type: array
      priority:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  main.CreateLabelPayload:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  main.CreateProjectCommentPayload:
    properties:
      content:
        type: string
    type: object
  main.CreateProjectPayload:
    properties:
      description:
        type: string
      emoji:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
    type: object
  main.CreateUserPayload:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  main.DeactivateUserResponse:
    properties:
      orphaned_projects:
        items:
          $ref: '#/definitions/store.ProjectRef'
        type: array
      user:
        $ref: '#/definitions/store.User'
    type: object
  main.LoginUserPayload:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  main.ResetPasswordPayload:
    properties:
      password:
        type: string
    type: object
  main.SetCyclesEnabledPayload:
    properties:
      enabled:
        type: boolean
    type: object
  main.SetupPayload:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  main.SetupStatusResponse:
    properties:
      app_name:
        type: string
      setup_required:
        type: boolean
    type: object
  main.UpdateCurrentUserPayload:
    properties:
      name:
        type: string
    type: object
  main.UpdateCyclePayload:
    properties:
      description:
        type: string
      end_date:
        type: string
      name:
        type: string
      start_date:
        type: string
    type: object
  main.UpdateIssueCommentPayload:
    properties:
      content:
        type: string
    type: object
  main.UpdateIssuePayload:
    properties:
      cycle_id:
        description: CycleID moves the issue into a cycle, or out of one with null.
        type: integer
      description:
        type: string
      priority:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  main.UpdateLabelPayload:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  main.UpdateProjectCommentPayload:
    properties:
      content:
        type: string
    type: object
  main.UpdateProjectMemberPayload:
    properties:
      role:
        type: string
    type: object
  main.UpdateProjectPayload:
    properties:
      description:
        type: string
      emoji:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
    type: object
  main.UpdateUserPayload:
    properties:
      name:
        type: string
      role:
        type: string
    type: object
  store.Assignee:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  store.Cycle:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      end_date:
        type: string
      id:
        type: integer
      issue_counts:
        additionalProperties:
          type: integer
        description: |-
          IssueCounts maps each issue status to how many of the cycle's issues have
          it, for progress. Statuses with no issues are absent.
        type: object
      name:
        type: string
      project_id:
        type: integer
      start_date:
        type: string
      status:
        description: |-
          Status depends on today's date, so it's worked out per request (see
          SetStatus) rather than stored.
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.Issue:
    properties:
      assignees:
        items:
          $ref: '#/definitions/store.Assignee'
        type: array
      author_id:
        type: string
      created_at:
        type: string
      cycle_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      labels:
        items:
          $ref: '#/definitions/store.LabelSummary'
        type: array
      priority:
        type: string
      project_id:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.IssueActivity:
    properties:
      actor:
        $ref: '#/definitions/store.UserSummary'
      actor_id:
        type: string
      created_at:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      payload:
        type: object
      type:
        type: string
    type: object
  store.IssueComment:
    properties:
      author:
        $ref: '#/definitions/store.UserSummary'
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.Label:
    properties:
      color:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      updated_at:
        type: string
    type: object
  store.LabelSummary:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  store.Membership:
    properties:
      project_id:
        type: integer
      role:
        type: string
      user_id:
        type: string
    type: object
  store.Project:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      cycles_enabled:
        description: CyclesEnabled is changed only through SetCyclesEnabled, never
          Update.
        type: boolean
      description:
        type: string
      emoji:
        type: string
      id:
        type: integer
      my_role:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.ProjectAccess:
    properties:
      can_manage:
        type: boolean
      is_superadmin:
        type: boolean
      role:
        type: string
    type: object
  store.ProjectComment:
    properties:
      content:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/store.UserSummary'
      id:
        type: integer
      project_id:
        type: integer
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.ProjectDetails:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      cycles_enabled:
        description: CyclesEnabled is changed only through SetCyclesEnabled, never
          Update.
        type: boolean
      description:
        type: string
      emoji:
        type: string
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/store.ProjectMember'
        type: array
      my_access:
        $ref: '#/definitions/store.ProjectAccess'
      my_role:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.ProjectMember:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      joined_at:
        type: string
      name:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  store.ProjectRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  store.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      must_change_password:
        type: boolean
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  store.UserSummary:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Trackforge application.
  title: Trackforge API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with email and password
      parameters:
      - description: User login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.LoginUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      description: Clear the auth cookie
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /events:
    get:
      description: Server-Sent Events. Each event names what changed (type and ids),
        not the new data; refetch it through the normal endpoints. The stream ends
        when the token expires.
      parameters:
      - description: Per-tab UUID. Events caused by requests that sent the same X-Client-ID
          header carry it, so that tab can skip them.
        in: query
        name: client_id
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream
          schema:
            type: string
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
      security:
      - BearerAuth: []
      summary: Stream change events
      tags:
      - events
  /health:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema: {}
      summary: Healthcheck
      tags:
      - health
  /issues/{issueID}:
    delete:
      description: Anyone in the project. Its comments and activity trail go with
        it; setting the status to cancelled instead keeps the history.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Delete an issue
      tags:
      - issues
    get:
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Issue'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Get one issue
      tags:
      - issues
    patch:
      consumes:
      - application/json
      description: Fields left out of the payload are unchanged. Every change is recorded
        on the issue's activity trail.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateIssuePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Issue'
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Edit an issue
      tags:
      - issues
  /issues/{issueID}/activities:
    get:
      description: Append-only record of everything that has happened to the issue,
        oldest first. The payload's shape depends on the entry's type, e.g. {"from":"todo","to":"done"}
        for status_changed.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.IssueActivity'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Read an issue's activity trail
      tags:
      - activities
  /issues/{issueID}/assignees:
    post:
      consumes:
      - application/json
      description: The user must already be a member of the project. An issue may
        have any number of assignees.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: User to assign
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.AddIssueAssigneePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Assignee'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Assign a user to an issue
      tags:
      - issues
  /issues/{issueID}/assignees/{userID}:
    delete:
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Unassign a user from an issue
      tags:
      - issues
  /issues/{issueID}/comments:
    get:
      description: Comments are returned newest first, each with a summary of its
        author.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.IssueComment'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: List an issue's comments
      tags:
      - issue-comments
    post:
      consumes:
      - application/json
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Comment content
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.CreateIssueCommentPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.IssueComment'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Post a comment on an issue
      tags:
      - issue-comments
  /issues/{issueID}/comments/{commentID}:
    delete:
      description: Only the comment's author or a project admin may delete it.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Comment ID
        in: path
        name: commentID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Delete an issue comment
      tags:
      - issue-comments
    patch:
      consumes:
      - application/json
      description: Only the comment's author or a project admin may edit it.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Comment ID
        in: path
        name: commentID
        required: true
        type: integer
      - description: New content
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateIssueCommentPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.IssueComment'
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Edit an issue comment
      tags:
      - issue-comments
  /issues/{issueID}/labels:
    post:
      consumes:
      - application/json
      description: Anyone in the project. The label must belong to the issue's project
        (422 otherwise). Applying a label the issue already has changes nothing and
        returns 200.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Label to apply
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.AddIssueLabelPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.LabelSummary'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.LabelSummary'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Apply a label to an issue
      tags:
      - issues
  /issues/{issueID}/labels/{labelID}:
    delete:
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Label ID
        in: path
        name: labelID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Remove a label from an issue
      tags:
      - issues
  /me:
    get:
      description: Return the user identified by the auth cookie or bearer token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "401":
          description: Unauthorized
          schema: {}
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - me
    patch:
      consumes:
      - application/json
      description: Change your own name
      parameters:
      - description: New name
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateCurrentUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Update the current user
      tags:
      - me
  /me/password:
    post:
      consumes:
      - application/json
      description: Requires the current password. Clears must_change_password
      parameters:
      - description: Current and new password
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.ChangePasswordPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Change the current user's password
      tags:
      - me
  /projects:
    get:
      description: The superadmin gets every project; everyone else gets the ones
        they belong to. Each project has my_role, the caller's role in it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Project'
            type: array
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: List the projects the caller can see
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Admins and the superadmin only. The creator becomes the project's
        first admin.
      parameters:
      - description: Project details
        in: body
        name: payload
        required: true
