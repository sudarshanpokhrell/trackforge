host: localhost:8080
info:
  contact: {}
  description: API for Trackforge application.
  title: Trackforge API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with email and password
      parameters:
      - description: User login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.LoginUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      description: Clear the auth cookie
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /health:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema: {}
      summary: Healthcheck
      tags:
      - health
  /issues/{issueID}:
    delete:
      description: Only the issue's author or a project admin may delete it. Its comments
        and activity trail go with it.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Delete an issue
      tags:
      - issues
    get:
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Issue'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Get one issue
      tags:
      - issues
    patch:
      consumes:
      - application/json
      description: Fields left out of the payload are unchanged. Every change is recorded
        on the issue's activity trail.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateIssuePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Issue'
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Edit an issue
      tags:
      - issues
  /issues/{issueID}/activities:
    get:
      description: Append-only record of everything that has happened to the issue,
        oldest first. The payload's shape depends on the entry's type, e.g. {"from":"todo","to":"done"}
        for status_changed.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.IssueActivity'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Read an issue's activity trail
      tags:
      - activities
  /issues/{issueID}/assignees:
    post:
      consumes:
      - application/json
      description: The user must already be a member of the project. An issue may
        have any number of assignees.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: User to assign
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.AddIssueAssigneePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Assignee'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Assign a user to an issue
      tags:
      - issues
  /issues/{issueID}/assignees/{userID}:
    delete:
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Unassign a user from an issue
      tags:
      - issues
  /issues/{issueID}/comments:
    get:
      description: Comments are returned newest first, each with a summary of its
        author.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.IssueComment'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: List an issue's comments
      tags:
      - issue-comments
    post:
      consumes:
      - application/json
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Comment content
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.CreateIssueCommentPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.IssueComment'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Post a comment on an issue
      tags:
      - issue-comments
  /issues/{issueID}/comments/{commentID}:
    delete:
      description: Only the comment's author or a project admin may delete it.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Comment ID
        in: path
        name: commentID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Delete an issue comment
      tags:
      - issue-comments
    patch:
      consumes:
      - application/json
      description: Only the comment's author or a project admin may edit it.
      parameters:
      - description: Issue ID
        in: path
        name: issueID
        required: true
        type: integer
      - description: Comment ID
        in: path
        name: commentID
        required: true
        type: integer
      - description: New content
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateIssueCommentPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.IssueComment'
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Edit an issue comment
      tags:
      - issue-comments
  /me:
    get:
      description: Return the user identified by the auth cookie or bearer token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "401":
          description: Unauthorized
          schema: {}
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - me
    patch:
      consumes:
      - application/json
      description: Change your own name
      parameters:
      - description: New name
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateCurrentUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Update the current user
      tags:
      - me
  /me/password:
    post:
      consumes:
      - application/json
      description: Requires the current password. Clears must_change_password
      parameters:
      - description: Current and new password
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.ChangePasswordPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Change the current user's password
      tags:
      - me
  /projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Project'
            type: array
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: List the caller's projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.CreateProjectPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Project'
        "400":
          description: Bad Request
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - projects
  /projects/{id}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Delete a project
      tags:
      - projects
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ProjectDetails'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Get a project with its members
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Partial update; omitted fields keep their current value.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateProjectPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Project'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Update a project
      tags:
      - projects
  /projects/{id}/comments:
    get:
      description: Comments are returned newest first, each with a summary of its
        creator.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
