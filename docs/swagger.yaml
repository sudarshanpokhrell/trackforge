      new_password:
        type: string
    type: object
  main.CreateIssueCommentPayload:
    properties:
      content:
        type: string
    type: object
  main.CreateIssuePayload:
    properties:
      description:
        type: string
      priority:
        type: string
      status:
        type: string
      title:
        type: string
