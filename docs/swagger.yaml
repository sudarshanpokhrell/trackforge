    - name
    - password
    type: object
  main.SetupStatusResponse:
    properties:
      app_name:
        type: string
      setup_required:
        type: boolean
    type: object
  main.UpdateCurrentUserPayload:
    properties:
      name:
        type: string
    type: object
  main.UpdateIssueCommentPayload:
    properties:
      content:
        type: string
    type: object
  main.UpdateIssuePayload:
    properties:
      description:
        type: string
      priority:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  main.UpdateProjectCommentPayload:
    properties:
      content:
        type: string
    type: object
  main.UpdateProjectLeadPayload:
