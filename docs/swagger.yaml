    type: object
  main.CreateProjectPayload:
    properties:
      description:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
    type: object
  main.CreateUserPayload:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
