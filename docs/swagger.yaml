basePath: /api/v1
definitions:
  main.AddProjectMemberPayload:
    properties:
      role:
        type: string
      user_id:
        type: string
    type: object
  main.CreateProjectPayload:
    properties:
      description:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
    type: object
  main.LoginUserPayload:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  main.RegisterUserPayload:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  main.UpdateProjectLeadPayload:
    properties:
      lead_id:
        type: string
    type: object
  main.UpdateProjectMemberRolePayload:
    properties:
      role:
        type: string
    type: object
  main.UpdateProjectPayload:
    properties:
      description:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
    type: object
  store.Membership:
    properties:
      project_id:
        type: integer
      role:
        type: string
      user_id:
        type: string
    type: object
  store.Project:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: integer
      lead_id:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.ProjectDetails:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: integer
      lead_id:
        type: string
      members:
        items:
          $ref: '#/definitions/store.ProjectMember'
        type: array
      name:
        type: string
      start_date:
        type: string
      target_date:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.ProjectMember:
    properties:
      email:
        type: string
      joined_at:
        type: string
      name:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  store.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Trackforge application.
  title: Trackforge API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with email and password
      parameters:
      - description: User login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.LoginUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Login a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with name, email, and password
      parameters:
      - description: User registration details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.RegisterUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: Bad Request
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Register a new user
      tags:
      - auth
  /health:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema: {}
      summary: Healthcheck
      tags:
      - health
  /projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Project'
            type: array
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: List the caller's projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.CreateProjectPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Project'
        "400":
          description: Bad Request
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - projects
  /projects/{id}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Delete a project
      tags:
      - projects
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ProjectDetails'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Get a project with its members
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Partial update; omitted fields keep their current value.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateProjectPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Project'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Update a project
      tags:
      - projects
  /projects/{id}/lead:
    put:
      consumes:
      - application/json
      description: Puts a user in charge of the project. They must already be a member
        of it. Use DELETE to unassign.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: The new lead
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateProjectLeadPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Project'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Set a project's lead
      tags:
      - projects
  /projects/{id}/members:
    post:
      consumes:
      - application/json
      description: Role defaults to "editor" when omitted.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Member to add
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.AddProjectMemberPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Membership'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Add a member to a project
      tags:
      - memberships
  /projects/{id}/members/{userID}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Remove a member from a project
      tags:
      - memberships
    patch:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - description: New role
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdateProjectMemberRolePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Membership'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Change a member's role
      tags:
      - memberships
securityDefinitions:
  BearerAuth:
    description: JWT from POST /auth/login. Paste it with the scheme included, e.g.
      "Bearer eyJhbGciOi..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
